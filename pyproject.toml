[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "face-voice-id"
version = "1.0.0"
description = "Multi-factor biometric authentication system using facial and voice recognition"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "opencv-python>=4.8.0",
    "numpy>=1.24.0",
    "face-recognition>=1.3.0",
    "librosa>=0.10.0",
    "sounddevice>=0.4.6",
    "scipy>=1.10.0",
    "soundfile>=0.12.1",
    "pydantic>=2.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0"
]
